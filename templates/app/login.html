<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astha Finance</title>
    <link rel="stylesheet" href="/static/assets/frontend/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/assets/frontend/css/fontawesome.min.css">
    <link rel="stylesheet" href="/static/assets/frontend/css/solid.css">
    <link rel="stylesheet" href="/static/assets/frontend/css/brands.css">
    <link rel="stylesheet" href="/static/assets/frontend/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
    <style>    
        .container-fluid{
            padding: 0px;
        }
        .row{
            margin:0px;
        }
        .loginDiv{
            padding:60px 15px;
            margin-top:50px;
        }
        h1{
            margin-top:20px;
            margin-bottom:20px;
        }
        .loginDiv form input{
            height:45px;
            padding:0px 20px;
        }
        .passwordinp{
            position:relative;
        }
        .field_icon{
            position:absolute;
            top:15px;
            right:10px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-12">
                <div class="loginDiv">
                    <div class="text-center">
                        <img src="/static/assets/frontend/img/logo.png" width="250" style="margin-bottom:50px;" alt="Logo">
                    </div>
                    <div>
                        {{ msg | safe }}
                    </div>
                    <form method="POST" action="/app/login">
                        <div class="form-group">
                            <input type="email" name="email" class="form-control rounded-pill" id="email" value="{{ email }}" placeholder="Enter Email" autocomplete="off" required>
                            {% if errors.email %}
                            <span class="text-danger">{{ errors.email }}</span>
                            {% endif %}
                        </div>
                        <div class="form-group passwordinp">
                            <input type="password" name="password" class="form-control rounded-pill" id="pass_log_id" placeholder="Enter Password" autocomplete="off" required>
                            <span toggle="#password-field" class="fa fa-fw fa-eye-slash field_icon toggle-password"></span>
                            {% if errors.password %}
                            <span class="text-danger">{{ errors.password }}</span>
                            {% endif %}
                        </div>
                        <input type="submit" name="submit" value="SIGN IN" class="btn rounded-pill btn-block btn-lg" style="background:#3a4094;color:#fff;">
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/assets/frontend/js/jquery-3.6.0.min.js"></script>
    <script src="/static/assets/frontend/js/bootstrap.bundle.min.js"></script>
    <script src="/static/assets/frontend/js/fontawesome.min.js"></script>
    <script>
        $("body").on('click', '.toggle-password', function() {
            $(this).toggleClass("fa-eye fa-eye-slash");
            var input = $("#pass_log_id");
            if (input.attr("type") === "password") {
                input.attr("type", "text");
            } else {
                input.attr("type", "password");
            }
        });
    </script>
</body>
</html>

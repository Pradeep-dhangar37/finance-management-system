<script>
  $(function () {
    $('.select2').select2();
    $('.numInput').on('input blur paste', function(){
      $(this).val($(this).val().replace(/\D/g, ''));
    });
    if ($('#example1').length) {
      $('#example1').DataTable({
        dom: 'lBfrtip',
        buttons: [
          { extend: 'excelHtml5', footer: true },
          { extend: 'pdfHtml5', footer: true }
        ]
      });
    }
  });

  function Popup(data) {
    var frame1 = $('<iframe />');
    frame1[0].name = "frame1";
    frame1.css({"position": "absolute", "top": "-1000000px"});
    $("body").append(frame1);
    var frameDoc = frame1[0].contentWindow ? frame1[0].contentWindow : frame1[0].contentDocument.document ? frame1[0].contentDocument.document : frame1[0].contentDocument;
    frameDoc.document.open();
    frameDoc.document.write('<html><head><title>Print Receipt</title></head><body>' + data + '</body></html>');
    frameDoc.document.close();
    setTimeout(function () {
      window.frames["frame1"].focus();
      window.frames["frame1"].print();
      frame1.remove();
    }, 500);
    return true;
  }

  $(document).on('click', '.printReceipt', function(e){
    e.preventDefault();
    var coll_id = $(this).attr('href');
    $.ajax({
      url: '/admin/collection/print',
      type: 'POST',
      data: { collection_id: coll_id },
      success: function(resp) {
        Popup(resp);
      }
    });
  });
</script>

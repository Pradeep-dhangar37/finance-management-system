<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Astha Finance - Login</title>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
  <link rel="stylesheet" href="/static/assets/bower_components/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/assets/bower_components/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="/static/assets/dist/css/AdminLTE.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic">
  <style>
    body {
      background-image: url('/static/img/background.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      background-color: #464646;
    }
    .layer {
      background-color: rgba(138, 135, 135, 0.7);
      top: 0; left: 0; width: 100%; height: 100%;
      position: fixed; z-index: -10;
    }
    .login-box-body {
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="hold-transition login-page">
<div class="layer"></div>
<div class="login-box">
  <div class="login-logo">
    <img src="/static/img/logo.png" width="95%" alt="Astha Finance">
  </div>
  <div class="login-box-body">
    <p class="login-box-msg">Sign in to start your session</p>
    {% if msg %}
      {{ msg|safe }}
    {% endif %}
    <form action="/admin/login" method="post">
      <div class="form-group has-feedback">
        <input type="email" name="email" value="{{ email }}" class="form-control" placeholder="Email" required autofocus>
        <span class="glyphicon glyphicon-envelope form-control-feedback"></span>
        {% if errors.email %}
          <div class="text-danger">{{ errors.email }}</div>
        {% endif %}
      </div>
      <div class="form-group has-feedback">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
        <span class="glyphicon glyphicon-lock form-control-feedback"></span>
        {% if errors.password %}
          <div class="text-danger">{{ errors.password }}</div>
        {% endif %}
      </div>
      <div class="row">
        <div class="col-xs-4">
          <button type="submit" class="btn btn-primary btn-block btn-flat">Log In</button>
        </div>
      </div>
    </form>
  </div>
</div>
<script src="/static/assets/bower_components/jquery/dist/jquery.min.js"></script>
<script src="/static/assets/bower_components/bootstrap/dist/js/bootstrap.min.js"></script>
</body>
</html>

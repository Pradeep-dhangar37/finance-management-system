{% include 'admin/header.html' %}
<div class="content-wrapper">
  <section class="content-header">
    <h1>Change Password</h1>
    <ol class="breadcrumb">
      <li><a href="/admin/dashboard"><i class="fa fa-dashboard"></i> Home</a></li>
      <li class="active">Change Password</li>
    </ol>
  </section>

  <section class="content">
    <div class="row">
      <div class="col-md-6">
        <div class="box box-primary">
          <div class="box-header with-border">
            <h3 class="box-title">Change Password</h3>
          </div>
          <form method="POST" action="/admin/dashboard/changePassword">
            <div class="box-body">
              {% if msg %}
                {{ msg|safe }}
              {% endif %}
              <div class="form-group" style="position:relative;">
                <label for="pass_log_id">New Password</label>
                <input type="password" name="password" class="form-control" id="pass_log_id" placeholder="Password" required>
                <span class="fa fa-fw fa-eye-slash toggle-password" style="position:absolute; right:10px; top:35px; cursor:pointer;"></span>
                {% if errors.password %}
                  <span class="text-danger">{{ errors.password }}</span>
                {% endif %}
              </div>
              <div class="form-group" style="position:relative;">
                <label for="cpass_log_id">Confirm Password</label>
                <input type="password" name="cpassword" class="form-control" id="cpass_log_id" placeholder="Confirm Password" required>
                <span class="fa fa-fw fa-eye-slash toggle-password2" style="position:absolute; right:10px; top:35px; cursor:pointer;"></span>
                {% if errors.cpassword %}
                  <span class="text-danger">{{ errors.cpassword }}</span>
                {% endif %}
              </div>
            </div>
            <div class="box-footer">
              <button type="submit" class="btn btn-primary">Change Password</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</div>
{% include 'admin/footer.html' %}
<script>
  $('.toggle-password').on('click', function() {
    $(this).toggleClass('fa-eye fa-eye-slash');
    var input = $('#pass_log_id');
    input.attr('type', input.attr('type') === 'password' ? 'text' : 'password');
  });
  $('.toggle-password2').on('click', function() {
    $(this).toggleClass('fa-eye fa-eye-slash');
    var input = $('#cpass_log_id');
    input.attr('type', input.attr('type') === 'password' ? 'text' : 'password');
  });
</script>
